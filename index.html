<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef,useContext,createContext}=React;
const html=htm.bind(React.createElement);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const T={
en:{appName:'StudyNest',tagline:'Calm focus, steady progress',game:{coins:'Study Coins',level:'Level',next:'XP to next level',levelUp:'Level up!'},ui:{listen:'Listen',mode:'Toggle night mode'},theme:'Mint & Sky',
 tabs:{timer:'Timer',schedule:'Schedule',tasks:'Tasks',sounds:'Sounds'},
 timer:{focus:'Focus',short:'Short break',long:'Long break',start:'Start',pause:'Pause',reset:'Reset',sessions:'Focus sessions done',settings:'Durations (minutes)',doneFocus:'Focus session complete! Take a break.',doneBreak:'Break is over. Ready to focus?'},
 schedule:{day:'Day',week:'Week',subject:'Subject',room:'Room or link',add:'Add lesson',empty:'No lessons on this day',days:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']},
 tasks:{placeholder:'Add a study task…',add:'Add task',due:'Due',progress:'Progress',empty:'Nothing to do. Add your first task.',swipe:'Swipe right to complete, left to delete',priority:{low:'Low',medium:'Medium',high:'High'}},
 sounds:{title:'Ambient sounds',master:'Master volume',rain:'Rain',forest:'Forest',ocean:'Ocean waves',cafe:'Quiet café',note:'Generated live with Web Audio. Works offline, no files needed.'}},
ar:{appName:'عش الدراسة',tagline:'تركيز هادئ وتقدم ثابت',game:{coins:'عملات الدراسة',level:'المستوى',next:'نقطة للمستوى التالي',levelUp:'ارتقيت مستوى!'},ui:{listen:'استمع',mode:'تبديل الوضع الليلي'},theme:'نعناعي وسماوي',
 tabs:{timer:'المؤقت',schedule:'الجدول',tasks:'المهام',sounds:'الأصوات'},
 timer:{focus:'تركيز',short:'استراحة قصيرة',long:'استراحة طويلة',start:'ابدأ',pause:'إيقاف مؤقت',reset:'إعادة',sessions:'جلسات التركيز المكتملة',settings:'المدد (بالدقائق)',doneFocus:'اكتملت جلسة التركيز! خذ استراحة.',doneBreak:'انتهت الاستراحة. هل أنت جاهز للتركيز؟'},
 schedule:{day:'اليوم',week:'الأسبوع',subject:'المادة',room:'القاعة أو الرابط',add:'إضافة درس',empty:'لا توجد دروس في هذا اليوم',days:['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']},
 tasks:{placeholder:'أضف مهمة دراسية…',add:'إضافة مهمة',due:'الموعد',progress:'التقدم',empty:'لا مهام بعد. أضف مهمتك الأولى.',swipe:'اسحب لليمين للإكمال، ولليسار للحذف',priority:{low:'منخفضة',medium:'متوسطة',high:'عالية'}},
 sounds:{title:'الأصوات المحيطة',master:'مستوى الصوت العام',rain:'مطر',forest:'غابة',ocean:'أمواج البحر',cafe:'مقهى هادئ',note:'تُولَّد مباشرة عبر Web Audio. تعمل بدون إنترنت ودون ملفات.'}}
};

function useLS(key,init){
  const [v,setV]=useState(()=>{try{const r=localStorage.getItem(key);return r?JSON.parse(r):init}catch(e){return init}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v))}catch(e){}},[key,v]);
  return [v,setV];
}

const I18n=createContext();
const useI18n=()=>useContext(I18n);
function Provider({children}){
  const [lang,setLang]=useLS('lang','en');const [dark,setDark]=useLS('dark',!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches));useEffect(()=>{document.documentElement.classList.toggle('dark',dark)},[dark]);
  useEffect(()=>{document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr'},[lang]);
  const t=p=>p.split('.').reduce((o,k)=>o&&o[k],T[lang])??p;
  return html`<${I18n.Provider} value=${{lang,setLang,t,dark,setDark}}>${children}<//>`;
}

const F='fld w-full rounded-xl border px-3 py-2 text-sm outline-none focus:border-aqua-500';
const Fr=React.Fragment;

/* ---------- Gamification: Study Coins + levels ---------- */
const lvlOf=xp=>Math.floor(Math.sqrt(xp/25))+1;
const G=createContext();const useGame=()=>useContext(G);
function Game({children}){
 const [g,setG]=useLS('game',{coins:0,xp:0}),[fx,setFx]=useState([]);
 const earn=(n,why)=>{
  const a=lvlOf(g.xp),b=lvlOf(g.xp+n),id=uid();
  setG(p=>({coins:p.coins+n,xp:p.xp+n}));
  setFx(f=>[...f,{id,n,why,up:b>a?b:0,parts:Array.from({length:14},(_,i)=>({x:Math.round(Math.random()*200-100),y:-Math.round(25+Math.random()*80),r:Math.round(Math.random()*540),e:['✨','🪙','🎉','⭐'][i%4]}))}]);
  setTimeout(()=>setFx(f=>f.filter(x=>x.id!==id)),2300);
 };
 return html`<${G.Provider} value=${{...g,lvl:lvlOf(g.xp),earn,fx}}>${children}<//>`;
}
function Burst({f}){
 const {t}=useI18n();
 return html`<div className="pointer-events-none absolute inset-0 z-10">
  <span className="absolute start-14 top-0 whitespace-nowrap text-lg font-extrabold text-amber-600" style=${{animation:'rise 2s ease-out forwards'}}>+${f.n} 🪙 ${f.why}</span>
  ${f.up?html`<span className="absolute inset-x-0 top-full mt-1 text-center text-sm font-bold text-mint-700" style=${{animation:'rise 2.2s ease-out forwards'}}>🎉 ${t('game.levelUp')} ${f.up}</span>`:null}
  ${f.parts.map((p,i)=>html`<span key=${i} className="absolute start-8 top-3" style=${{'--x':p.x+'px','--y':p.y+'px','--r':p.r+'deg',animation:'conf 1.3s ease-out forwards'}}>${p.e}</span>`)}</div>`;
}

/* ---------- Text-to-speech (browser SpeechSynthesis, EN + AR) ---------- */
const canSpeak=typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
function speak(text,ui){
 if(!canSpeak)return;
 const ar=/[\u0600-\u06FF]/.test(text)||(!/[A-Za-z]/.test(text)&&ui==='ar'),code=ar?'ar':'en';
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text),v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith(code));
 if(v)u.voice=v;u.lang=v?v.lang:(ar?'ar-SA':'en-US');u.rate=.9;
 speechSynthesis.speak(u);
}
const Say=({text})=>{const {lang}=useI18n();return canSpeak?html`<button onClick=${e=>{e.stopPropagation();speak(text,lang)}} aria-label=${T[lang].ui.listen} title=${T[lang].ui.listen} className="text-base">🔊</button>`:null};
const B='rounded-xl bg-gradient-to-r from-mint-500 to-aqua-500 px-4 py-2 text-sm font-semibold text-white shadow';
const Card=({children,className=''})=>html`<section className=${'card rounded-3xl p-5 shadow-lg shadow-aqua-300/20 backdrop-blur '+className}>${children}</section>`;
const Seg=({value,onChange,opts})=>html`<div className="flex gap-1 rounded-2xl bg-aqua-100/70 p-1">${opts.map(([k,l])=>html`<button key=${k} onClick=${()=>onChange(k)} className=${'flex-1 rounded-xl px-3 py-1.5 text-xs font-medium sm:text-sm '+(value===k?'bg-white text-mint-700 shadow':'text-slate-500')}>${l}</button>`)}</div>`;

/* ---------- Ambient audio (Web Audio, no files) ---------- */
const KEYS=['rain','forest','ocean','cafe'];
const ICON={rain:'🌧️',forest:'🌲',ocean:'🌊',cafe:'☕'};
// Hosted pages can't stream external audio, so the sounds are layered, stereo, procedurally generated.
const DEFS={
 rain:{layers:[{n:'pink',f:[['highpass',500],['lowpass',9000]],g:.9},{n:'white',f:[['highpass',4500]],g:.25,lfo:[.3,.3]},{n:'brown',f:[['lowpass',200]],g:.5}],ev:[{k:'drop',every:150},{k:'thunder',every:28000}]},
 forest:{layers:[{n:'brown',f:[['lowpass',500]],g:1,lfo:[.08,.5]},{n:'pink',f:[['bandpass',1800,.8]],g:.15,lfo:[.2,.8]}],ev:[{k:'bird',every:2200}]},
 ocean:{layers:[{n:'brown',f:[['lowpass',700]],g:1.2,lfo:[.09,.75]},{n:'pink',f:[['highpass',1500],['lowpass',6000]],g:.35,lfo:[.09,.9]}]},
 cafe:{layers:[{n:'pink',f:[['bandpass',500,.7]],g:1,lfo:[.25,.25]},{n:'pink',f:[['bandpass',1400,1.2]],g:.4,lfo:[.4,.4]}],ev:[{k:'clink',every:3500}]}};
function noiseBuf(c,kind){
 const len=c.sampleRate*6,b=c.createBuffer(2,len,c.sampleRate);
 for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0,b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;
   if(kind==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}
   else if(kind==='pink'){b0=.99765*b0+w*.099046;b1=.963*b1+w*.2965164;b2=.57*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.11}
   else d[i]=w*.5}}
 return b;
}
function ev(c,out,k){
 const t=c.currentTime,g=c.createGain();g.connect(out);
 if(k==='thunder'){const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=noiseBuf(c,'brown');f.type='lowpass';f.frequency.value=140;s.connect(f);f.connect(g);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.6,t+1.2);g.gain.exponentialRampToValueAtTime(.001,t+6);s.start(t);s.stop(t+6.5);return}
 const o=c.createOscillator();o.type='sine';o.connect(g);
 if(k==='drop'){const f=1800+Math.random()*2600;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.05);g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);o.start(t);o.stop(t+.07)}
 else if(k==='bird'){const base=2200+Math.random()*1800,n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){const q=t+i*.14;o.frequency.setValueAtTime(base*(1+i*.12),q);o.frequency.exponentialRampToValueAtTime(base*(1.35+i*.1),q+.09);g.gain.setValueAtTime(0,q);g.gain.linearRampToValueAtTime(.07,q+.02);g.gain.linearRampToValueAtTime(0,q+.1)}
  o.start(t);o.stop(t+n*.14+.1)}
 else{const f=2400+Math.random()*1200,o2=c.createOscillator();o.frequency.value=f;o2.frequency.value=f*2.76;o2.connect(g);
  g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.start(t);o2.start(t);o.stop(t+.55);o2.stop(t+.55)}
}
function layer(c,d,master,vol){
 const nodes=[],g=c.createGain();g.gain.value=0;g.connect(master);
 d.layers.forEach(L=>{
  const src=c.createBufferSource();src.buffer=noiseBuf(c,L.n);src.loop=true;
  let n=src;L.f.forEach(([type,hz,q])=>{const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=hz;if(q)fl.Q.value=q;n.connect(fl);n=fl});
  const m=c.createGain();m.gain.value=L.g;n.connect(m);m.connect(g);
  if(L.lfo){const lfo=c.createOscillator(),dp=c.createGain();lfo.frequency.value=L.lfo[0]*(.9+Math.random()*.2);dp.gain.value=L.g*L.lfo[1];m.gain.value=L.g*(1-L.lfo[1]);lfo.connect(dp);dp.connect(m.gain);lfo.start();nodes.push(lfo)}
  src.start(0,Math.random()*3);nodes.push(src);
 });
 g.gain.setTargetAtTime(vol,c.currentTime,.4);
 const stops=(d.ev||[]).map(e=>{let id;const loop=()=>{ev(c,g,e.k);id=setTimeout(loop,e.every*(.5+Math.random()*1.5))};id=setTimeout(loop,e.every*Math.random()+500);return()=>clearTimeout(id)});
 return {g,stop(){stops.forEach(f=>f());g.gain.setTargetAtTime(0,c.currentTime,.25);setTimeout(()=>nodes.forEach(n=>{try{n.stop()}catch(e){}}),900)}};
}
function useAmbient(){
 const [vols,setVols]=useLS('sound-vols',{rain:.5,forest:.5,ocean:.5,cafe:.5,master:.8});
 const [on,setOn]=useState({});
 const ctx=useRef(null),master=useRef(null),live=useRef({});
 useEffect(()=>{const c=ctx.current;if(!c)return;master.current.gain.setTargetAtTime(vols.master,c.currentTime,.1);
  for(const k in live.current)live.current[k].g.gain.setTargetAtTime(vols[k],c.currentTime,.1)},[vols]);
 const toggle=k=>{
  if(!ctx.current){const c=new (window.AudioContext||window.webkitAudioContext)(),m=c.createGain();m.gain.value=vols.master;m.connect(c.destination);ctx.current=c;master.current=m}
  ctx.current.resume();
  if(live.current[k]){live.current[k].stop();delete live.current[k]}else live.current[k]=layer(ctx.current,DEFS[k],master.current,vols[k]);
  setOn(o=>({...o,[k]:!!live.current[k]}));
 };
 return {on,vols,toggle,setVol:(k,v)=>setVols(p=>({...p,[k]:v}))};
}

/* ---------- Components ---------- */
function Header(){
 const {lang,setLang,t,dark,setDark}=useI18n();
 const {coins,lvl,xp,fx}=useGame();
 const lo=25*(lvl-1)**2,hi=25*lvl**2,pct=Math.round((xp-lo)/(hi-lo)*100);
 const btn='rounded-full bg-white/80 px-3 py-2 text-sm font-medium text-slate-700 shadow-sm';
 return html`<header className="space-y-3">
  <div className="flex items-center justify-between gap-3">
   <div className="flex items-center gap-3">
    <div className="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-mint-300 to-aqua-300 text-xl shadow">🍃</div>
    <div><h1 className="text-xl font-bold text-slate-800">${t('appName')}</h1><p className="text-xs text-slate-500">${t('tagline')}</p></div>
   </div>
   <div className="flex items-center gap-2">
    <button onClick=${()=>setDark(!dark)} aria-label=${t('ui.mode')} className=${btn}>${dark?'☀️':'🌙'}</button>
    <button onClick=${()=>setLang(lang==='en'?'ar':'en')} className=${btn}>🌐 ${lang==='en'?'العربية':'English'}</button>
   </div>
  </div>
  <div className="card relative flex items-center gap-3 rounded-2xl px-4 py-2.5 shadow">
   <span key=${coins} className="bump inline-block text-2xl">🪙</span>
   <div className="leading-tight"><b className="text-lg tabular-nums text-amber-700">${coins}</b><div className="text-[11px] text-slate-500">${t('game.coins')}</div></div>
   <div className="ms-auto w-40 sm:w-56">
    <div className="mb-1 flex justify-between text-[11px] text-slate-500"><span>${t('game.level')} ${lvl}</span><span>${hi-xp} ${t('game.next')}</span></div>
    <div className="h-2 overflow-hidden rounded-full bg-aqua-100"><div className="h-full bg-gradient-to-r from-mint-500 to-aqua-500" style=${{width:pct+'%',transition:'width .6s'}}></div></div>
   </div>
   ${fx.map(f=>html`<${Burst} key=${f.id} f=${f}/>`)}
  </div></header>`;
}

const MODES=['focus','short','long'],R=110,C=2*Math.PI*R;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(d=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+d;
 o.frequency.value=660;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.28)})}catch(e){}}
function StudyTimer(){
 const {t}=useI18n();
 const {earn}=useGame();const [cfg,setCfg]=useLS('timer-cfg',{focus:25,short:5,long:15});
 const [done,setDone]=useLS('timer-done',0);
 const [mode,setMode]=useState('focus'),[left,setLeft]=useState(cfg.focus*60),[running,setRunning]=useState(false),[msg,setMsg]=useState('');
 const endAt=useRef(0),onEnd=useRef();
 useEffect(()=>{setRunning(false);setLeft(cfg[mode]*60)},[cfg,mode]);
 onEnd.current=()=>{
  setRunning(false);beep();
  const text=t(mode==='focus'?'timer.doneFocus':'timer.doneBreak');setMsg(mode==='focus'?text+' +'+(cfg.focus+5)+' 🪙':text);
  try{if(Notification.permission==='granted')new Notification(text)}catch(e){}
  if(mode==='focus'){setDone(done+1);earn(cfg.focus+5,'⏱️')}
  setMode(mode==='focus'?((done+1)%4===0?'long':'short'):'focus');
 };
 useEffect(()=>{
  if(!running)return;
  endAt.current=Date.now()+left*1000;
  const id=setInterval(()=>{const r=Math.max(0,Math.ceil((endAt.current-Date.now())/1000));setLeft(r);if(r===0){clearInterval(id);onEnd.current()}},250);
  return()=>clearInterval(id);
 },[running]);
 const start=()=>{try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}setMsg('');setRunning(true)};
 const total=cfg[mode]*60,mm=String(Math.floor(left/60)).padStart(2,'0'),ss=String(left%60).padStart(2,'0');
 return html`<${Card} className="flex flex-col items-center gap-5">
  <div className="w-full"><${Seg} value=${mode} onChange=${setMode} opts=${MODES.map(m=>[m,t('timer.'+m)])}/></div>
  <div className="relative">
   <svg viewBox="0 0 260 260" className="h-64 w-64 -rotate-90">
    <circle cx="130" cy="130" r=${R} fill="none" className="track" strokeWidth="14"/>
    <circle cx="130" cy="130" r=${R} fill="none" stroke="#4cbf7f" strokeWidth="14" strokeLinecap="round" strokeDasharray=${C} style=${{strokeDashoffset:C*(1-left/total),transition:'stroke-dashoffset .3s'}}/>
   </svg>
   <div dir="ltr" className="absolute inset-0 grid place-items-center text-5xl font-light tabular-nums text-slate-700">${mm}:${ss}</div>
  </div>
  <div className="flex gap-3">
   <button onClick=${running?()=>setRunning(false):start} className=${B+' px-6 py-3'}>${running?'⏸ '+t('timer.pause'):'▶ '+t('timer.start')}</button>
   <button onClick=${()=>{setRunning(false);setLeft(total)}} className="rounded-xl bg-white px-4 py-3 text-sm text-slate-600 shadow">↺ ${t('timer.reset')}</button>
  </div>
  ${msg&&html`<p className="pop rounded-xl bg-mint-100 px-4 py-2 text-center text-sm text-mint-700">${msg}</p>`}
  <p className="text-sm text-slate-500">${t('timer.sessions')}: <b className="text-mint-700">${done}</b></p>
  <div className="w-full"><p className="mb-2 text-xs text-slate-500">${t('timer.settings')}</p>
   <div className="grid grid-cols-3 gap-2">${MODES.map(m=>html`<label key=${m} className="text-xs text-slate-500">${t('timer.'+m)}
    <input type="number" min="1" max="180" value=${cfg[m]} className=${F+' mt-1'} onChange=${e=>setCfg({...cfg,[m]:Math.min(180,Math.max(1,+e.target.value||1))})}/></label>`)}</div>
  </div><//>`;
}

const today=new Date().getDay();
const tilt=id=>{let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return((Math.abs(h)%1000)/1000-.5)*2.6};
const hl='linear-gradient(transparent 55%,rgba(159,224,183,.75) 55%)';
function Lesson({l,onDelete}){
 const link=/^https?:\/\//.test(l.room),r=tilt(l.id);
 return html`<li className="pop" style=${{transform:`rotate(${r}deg)`,transformOrigin:'0 50%'}}>
  <div className="ink flex items-baseline gap-3">
   <span dir="ltr" className="w-24 shrink-0" style=${{color:'var(--ink2)'}}>${l.start}–${l.end}</span>
   <span className="inline-block min-w-0 flex-1 truncate font-bold" style=${{background:hl,transform:`rotate(${-r/2}deg)`}}>${l.subject}</span>
   <${Say} text=${l.subject}/>
   <button onClick=${onDelete} aria-label="delete" className="text-sm opacity-60">🗑</button></div>
  ${l.room&&html`<div className="ink ps-[6.75rem] text-lg" style=${{color:'var(--ink2)',transform:`rotate(${r/2}deg)`}}>${link?html`<a href=${l.room} target="_blank" rel="noreferrer" className="underline">🔗 ${l.room.replace(/^https?:\/\//,'')}</a>`:'📍 '+l.room}</div>`}</li>`;
}
function Timetable(){
 const {t}=useI18n();const days=t('schedule.days');
 const [items,setItems]=useLS('timetable',[]),[view,setView]=useState('day'),[day,setDay]=useState(today);
 const [f,setF]=useState({day:today,start:'09:00',end:'10:00',subject:'',room:''});
 const add=e=>{e.preventDefault();if(!f.subject.trim())return;setItems([...items,{...f,day:+f.day,id:uid()}]);setF({...f,subject:'',room:''})};
 const list=(d,quiet)=>{
  const L=items.filter(i=>i.day===d).sort((a,b)=>a.start.localeCompare(b.start));
  if(!L.length)return quiet?null:html`<p className="ink opacity-60">${t('schedule.empty')}</p>`;
  return html`<ul>${L.map(l=>html`<${Lesson} key=${l.id} l=${l} onDelete=${()=>setItems(items.filter(i=>i.id!==l.id))}/>`)}</ul>`;
 };
 const tab=(on,fn,label,wavy)=>html`<button key=${label} onClick=${fn} className="ink shrink-0 px-1" style=${{background:on?hl:'none',textDecoration:wavy?'underline wavy var(--margin)':'none'}}>${label}</button>`;
 return html`<div className="space-y-4">
  <div className="paper min-h-[288px] rounded-3xl shadow-lg">
   <div className="ink flex items-center justify-between gap-3">
    <span className="text-2xl font-bold">📓 ${t('tabs.schedule')}</span>
    <span className="flex gap-2">${tab(view==='day',()=>setView('day'),t('schedule.day'))}${tab(view==='week',()=>setView('week'),t('schedule.week'))}</span></div>
   ${view==='day'?html`<${Fr}><div className="ns flex h-8 gap-2 overflow-x-auto whitespace-nowrap">${days.map((n,i)=>tab(day===i,()=>setDay(i),n,i===today))}</div>${list(day)}<//>`
   :days.map((n,i)=>html`<div key=${i}><h3 className="ink text-xl font-bold" style=${{color:i===today?'var(--ink2)':'var(--ink)',textDecoration:'underline wavy var(--margin)',textDecorationThickness:'1px'}}>${n}</h3>${list(i,true)}</div>`)}
  </div>
  <${Card}><form onSubmit=${add} className="grid grid-cols-2 gap-2">
   <select className=${F+' col-span-2'} value=${f.day} onChange=${e=>setF({...f,day:e.target.value})}>${days.map((n,i)=>html`<option key=${i} value=${i}>${n}</option>`)}</select>
   <input type="time" dir="ltr" className=${F} value=${f.start} onChange=${e=>setF({...f,start:e.target.value})}/>
   <input type="time" dir="ltr" className=${F} value=${f.end} onChange=${e=>setF({...f,end:e.target.value})}/>
   <input className=${F+' col-span-2'} placeholder=${t('schedule.subject')} value=${f.subject} onChange=${e=>setF({...f,subject:e.target.value})}/>
   <input className=${F+' col-span-2'} placeholder=${t('schedule.room')} value=${f.room} onChange=${e=>setF({...f,room:e.target.value})}/>
   <button className=${B+' col-span-2'}>＋ ${t('schedule.add')}</button></form><//>
 </div>`;
}

const PRI={high:'bg-rose-100 text-rose-700',medium:'bg-amber-100 text-amber-700',low:'bg-mint-100 text-mint-700'};
const todayStr=new Date().toISOString().slice(0,10);
function Task({k,onToggle,onDelete}){
 const {t}=useI18n();
 const [dx,setDx]=useState(0),[drag,setDrag]=useState(false),[gone,setGone]=useState(false);
 const st=useRef(null);
 const down=e=>{st.current={x:e.clientX,id:e.pointerId}};
 const move=e=>{
  if(!st.current)return;const d=e.clientX-st.current.x;
  if(!drag&&Math.abs(d)>6){setDrag(true);try{e.currentTarget.setPointerCapture(st.current.id)}catch(_){}}
  if(drag||Math.abs(d)>6)setDx(Math.max(-160,Math.min(160,d)));
 };
 const up=()=>{
  st.current=null;
  if(drag){if(dx>90)onToggle();else if(dx<-90){setGone(true);setTimeout(onDelete,250)}}
  setDrag(false);setDx(0);
 };
 const a=Math.min(.55,Math.abs(dx)/200),bg=dx>0?`rgba(76,191,127,${a})`:dx<0?`rgba(244,63,94,${a})`:'#fff';
 const overdue=k.due&&k.due<todayStr&&!k.done;
 return html`<li onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}
  style=${{transform:gone?'translateX(-120%)':`translateX(${dx}px)`,opacity:gone?0:1,background:dx?bg:undefined,touchAction:'pan-y',transition:drag?'none':'transform .25s, opacity .25s, background .25s'}}
  className="pop flex cursor-grab select-none items-center gap-3 rounded-2xl bg-white p-3 shadow-sm">
  <button onClick=${onToggle} aria-label="toggle" className=${'grid h-6 w-6 shrink-0 place-items-center rounded-full border-2 text-xs '+(k.done?'border-mint-500 bg-mint-500 text-white':'border-aqua-300')}>${k.done?'✓':''}</button>
  <div className="min-w-0 flex-1">
   <p className=${'truncate text-sm '+(k.done?'text-slate-400 line-through':'text-slate-800')}>${k.text}</p>
   ${k.due&&html`<p className=${'mt-0.5 text-xs '+(overdue?'text-rose-600':'text-slate-500')}>📅 ${t('tasks.due')}: ${k.due}</p>`}
  </div>
  <${Say} text=${k.text}/><span className=${'rounded-full px-2 py-0.5 text-xs '+PRI[k.priority]}>${t('tasks.priority.'+k.priority)}</span></li>`;
}
function TaskList(){
 const {t}=useI18n();
 const {earn}=useGame();const [tasks,setTasks]=useLS('tasks',[]),[text,setText]=useState(''),[due,setDue]=useState(''),[priority,setPriority]=useState('medium');
 const add=e=>{e.preventDefault();if(!text.trim())return;setTasks([...tasks,{id:uid(),text:text.trim(),due,priority,done:false}]);setText('');setDue('')};
 const toggle=k=>{if(!k.done&&!k.rewarded)earn(({low:5,medium:10,high:15})[k.priority]+(k.due&&k.due>=todayStr?5:0),'✅');setTasks(tasks.map(x=>x.id===k.id?{...x,done:!x.done,rewarded:x.rewarded||!x.done}:x))};
 const dn=tasks.filter(k=>k.done).length,pct=tasks.length?Math.round(dn/tasks.length*100):0;
 const sorted=[...tasks].sort((a,b)=>a.done-b.done||(a.due||'9').localeCompare(b.due||'9'));
 return html`<div className="space-y-4">
  <${Card}><div className="mb-2 flex justify-between text-sm text-slate-600"><span>${t('tasks.progress')}</span><b className="text-mint-700">${dn}/${tasks.length} · ${pct}%</b></div>
   <div className="h-2.5 overflow-hidden rounded-full bg-aqua-100"><div className="h-full rounded-full bg-gradient-to-r from-mint-500 to-aqua-500" style=${{width:pct+'%',transition:'width .4s'}}></div></div><//>
  <${Card}><form onSubmit=${add} className="grid grid-cols-2 gap-2">
   <input className=${F+' col-span-2'} placeholder=${t('tasks.placeholder')} value=${text} onChange=${e=>setText(e.target.value)}/>
   <input type="date" dir="ltr" className=${F} value=${due} onChange=${e=>setDue(e.target.value)}/>
   <select className=${F} value=${priority} onChange=${e=>setPriority(e.target.value)}>${['low','medium','high'].map(p=>html`<option key=${p} value=${p}>${t('tasks.priority.'+p)}</option>`)}</select>
   <button className=${B+' col-span-2'}>＋ ${t('tasks.add')}</button></form><//>
  <div>${tasks.length>0&&html`<p className="mb-2 text-center text-xs text-slate-400">${t('tasks.swipe')}</p>`}
   <ul className="space-y-2">${sorted.map(k=>html`<${Task} key=${k.id} k=${k} onToggle=${()=>toggle(k)} onDelete=${()=>setTasks(tasks.filter(x=>x.id!==k.id))}/>`)}</ul>
   ${!tasks.length&&html`<p className="py-6 text-center text-sm text-slate-400">${t('tasks.empty')}</p>`}</div>
 </div>`;
}

function SoundMixer({audio}){
 const {t}=useI18n();const {on,vols,toggle,setVol}=audio;
 return html`<${Card} className="space-y-5">
  <h2 className="text-lg font-semibold text-slate-800">${t('sounds.title')}</h2>
  <label className="flex items-center gap-3 text-sm text-slate-600">🔊 <span className="w-28 shrink-0">${t('sounds.master')}</span>
   <input type="range" min="0" max="1" step="0.01" value=${vols.master} onChange=${e=>setVol('master',+e.target.value)} className="w-full accent-aqua-500"/></label>
  <div className="grid grid-cols-2 gap-3">${KEYS.map(k=>html`<div key=${k} className=${'rounded-2xl p-4 transition '+(on[k]?'tile-on':'bg-slate-50')}>
   <button onClick=${()=>toggle(k)} aria-pressed=${!!on[k]} className=${'mb-2 grid h-12 w-12 place-items-center rounded-2xl text-2xl shadow '+(on[k]?'bg-mint-500':'bg-white')}>${ICON[k]}</button>
   <p className="mb-2 text-sm font-medium text-slate-700">${t('sounds.'+k)}</p>
   <input type="range" min="0" max="1" step="0.01" value=${vols[k]} onChange=${e=>setVol(k,+e.target.value)} className="w-full accent-mint-500"/></div>`)}</div>
  <p className="text-center text-xs text-slate-400">${t('sounds.note')}</p><//>`;
}

function App(){
 const {t}=useI18n();
 const [tab,setTab]=useLS('tab','timer');
 const audio=useAmbient();
 const tabs=[['timer','⏱️',html`<${StudyTimer}/>`],['schedule','📅',html`<${Timetable}/>`],['tasks','✅',html`<${TaskList}/>`],['sounds','🎧',html`<${SoundMixer} audio=${audio}/>`]];
 return html`<div className="page min-h-screen px-4 py-6"><div className="mx-auto max-w-xl">
  <${Header}/>
  <img src=${COVER} alt="" className="mt-4 block h-28 w-full rounded-3xl object-cover shadow-lg sm:h-40"/>
  <nav className="my-5 flex gap-1 rounded-2xl bg-white/70 p-1.5 shadow-sm">${tabs.map(([id,ic])=>html`<button key=${id} onClick=${()=>setTab(id)} className=${'flex-1 rounded-xl py-2.5 text-xs font-medium text-slate-700 transition sm:text-sm '+(tab===id?'bg-gradient-to-r from-mint-300 to-aqua-300 shadow':'')}>${ic} ${t('tabs.'+id)}</button>`)}</nav>
  ${tabs.map(([id,,el])=>html`<div key=${id} hidden=${tab!==id} className=${tab===id?'panel':''}>${el}</div>`)}
 </div></div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${Provider}><${Game}><${App}/><//><//>`);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
